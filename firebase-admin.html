<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase 後臺管理 — P&amp;J Compound Company Limited</title>
<style>
:root{--brown:#6D3A0F;--dark:#2C1503;--gold:#B8860B;--cream:#FAF7F2;--ink:#1C1917;--muted:#6B6560;--border:#E8E2D8;--pos:#15803D;--neg:#B91C1C}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;font-size:14px}.banner{height:64px;display:flex;align-items:center;gap:12px;padding:0 26px;background:linear-gradient(135deg,var(--dark),var(--brown));color:#fff}.banner img{width:42px;height:42px}.banner h1{font-size:17px}.badge{padding:4px 10px;border:1px solid rgba(255,220,120,.5);border-radius:14px;color:#ffe08a;font-size:11px;font-weight:700}.back{margin-left:auto;color:#fff;text-decoration:none;font-size:12px}.page{max-width:1220px;margin:auto;padding:28px 20px 60px}.head{margin-bottom:18px}.head h2{margin:0;color:var(--brown)}.head p{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.card{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05)}.wide{grid-column:1/-1}.card-head{padding:14px 17px;border-bottom:1px solid var(--border);background:#fdfaf6;color:var(--brown);font-weight:700}.body{padding:15px 17px}.row{display:flex;gap:8px;margin-bottom:10px}.group{display:flex;flex:1;flex-direction:column;gap:4px}.group label{color:var(--muted);font-size:11px;font-weight:700}.group input,.group select{width:100%;padding:9px;border:1px solid var(--border);border-radius:6px;font:inherit}.btn{padding:9px 12px;border:0;border-radius:7px;background:linear-gradient(135deg,var(--dark),var(--brown));color:#fff;cursor:pointer;font:inherit;font-size:12px;font-weight:700}.btn.alt{border:1px solid var(--border);background:#fff;color:var(--brown)}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{color:var(--muted);font-size:12px;line-height:1.65}.ok{color:var(--pos);font-weight:700}.error{color:var(--neg);font-weight:700}.list{display:flex;flex-direction:column;gap:7px}.item{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--border);border-radius:7px;background:#fdfaf6}.grow{flex:1;min-width:0}.title{font-weight:700}.sub{margin-top:2px;color:var(--muted);font-size:11px}.pill{padding:2px 7px;border-radius:10px;background:#dcfce7;color:#15803d;font-size:10px;font-weight:700}.pill.off{background:#fee2e2;color:#b91c1c}.gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--dark),#150800)}.gate.hidden{display:none}.gate-card{width:min(410px,100%);padding:30px;border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45)}.gate-card h2{margin-top:0;color:var(--brown)}.gate-card input{width:100%;margin-bottom:9px;padding:11px;border:1px solid var(--border);border-radius:7px;font:inherit}.gate-card .btn{width:100%}.filebox{padding:14px;border:1px dashed #bda98f;border-radius:8px;background:#fffdf9}.status{min-height:20px;margin-top:8px;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-card"><h2>Firebase 管理員登入</h2><p class="notice">請使用已設定為管理員的 Firebase 帳號登入。</p><input id="admin-email" type="email" value="john.cyl@gmail.com" autocomplete="username"><input id="admin-password" type="password" placeholder="管理員密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()"><button class="btn" onclick="adminLogin()">登入後臺</button><div class="status error" id="gate-status"></div></div></div>
<header class="banner"><img src="assets/pj-compound-mark.svg" alt="P&J Compound Logo"><h1>P&amp;J Compound Company Limited</h1><span class="badge">Firebase Admin</span><a class="back" href="./index.html">返回入口網站</a></header>
<main class="page">
  <div class="head"><h2>個人對帳單管理</h2><p>建立股東帳號後，即可依月份批次上傳 PDF。系統會依檔名中的 PS001、CS002 等編號自動配對。</p></div>
  <div class="grid">
    <section class="card"><div class="card-head">管理員狀態</div><div class="body"><div id="admin-state" class="notice">尚未登入</div><div class="row" style="margin-top:12px"><button class="btn alt" onclick="adminLogout()">登出</button><a class="btn alt" href="./admin.html" style="text-decoration:none">舊版內容管理</a></div></div></section>
    <section class="card"><div class="card-head">股東帳號初始化</div><div class="body"><p class="notice">首次建立時，請輸入至少 6 碼臨時密碼。完成後將密碼個別交付股東，不要在對話中傳送。</p><div class="row"><div class="group"><label>共用臨時密碼</label><input id="initial-password" type="password" placeholder="至少 6 碼"></div><button class="btn" onclick="initializeShareholders()">建立尚未建立的股東</button></div><div class="status" id="shareholder-status"></div></div></section>
    <section class="card wide"><div class="card-head">股東名單</div><div class="body"><div class="list" id="shareholder-list"></div></div></section>
    <section class="card wide"><div class="card-head">批次發布個人對帳單</div><div class="body">
      <div class="row"><div class="group"><label>年份</label><select id="statement-year"><option>2025</option><option selected>2026</option><option>2027</option><option>2028</option></select></div><div class="group"><label>月份</label><select id="statement-month"></select></div></div>
      <div class="filebox"><div class="group"><label>選擇當月份 PDF，可一次選取多份</label><input id="statement-files" type="file" accept="application/pdf,.pdf" multiple></div><div id="file-preview" class="status notice">尚未選擇檔案。</div></div>
      <div class="row" style="margin-top:12px"><button class="btn" onclick="publishStatements()">確認配對並發布</button></div><div class="status" id="upload-status"></div>
    </div></section>
  </div>
</main>
<script type="module">
import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
import { auth, db, storage, firebaseConfig, shareholderEmail } from './firebase-portal.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
import { collection, doc, getDocs, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
import { ref, uploadBytes } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js';
const SHAREHOLDERS=[
  {code:'CS001',name:'譚佐權'},{code:'CS002',name:'李哲宇'},{code:'PS001',name:'王巧'},
  {code:'PS002',name:'張宏瑋'},{code:'PS003',name:'廖啟發'},{code:'PS004',name:'李哲銘'},
  {code:'PS005',name:'鄭雅綾'},{code:'PS006',name:'陳柏睿'},{code:'PS007',name:'王慶煌'}
];
let shareholderDocs=[],selectedFiles=[];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function setStatus(id,text,type=''){const el=$(id);el.textContent=text;el.className=`status ${type}`}
async function adminLogin(){setStatus('gate-status','登入中...');try{const cred=await signInWithEmailAndPassword(auth,$('admin-email').value.trim(),$('admin-password').value),token=await cred.user.getIdTokenResult(true);if(token.claims.admin!==true){await signOut(auth);throw new Error('此帳號沒有管理員權限。')}setStatus('gate-status','');$('gate').classList.add('hidden');await loadShareholders()}catch(e){setStatus('gate-status',e.message,'error')}}
async function adminLogout(){await signOut(auth);location.reload()}
async function loadShareholders(){const snaps=await getDocs(collection(db,'shareholders'));shareholderDocs=snaps.docs.map(d=>({uid:d.id,...d.data()}));renderShareholders();$('admin-state').innerHTML=`<span class="ok">已登入：</span>${esc(auth.currentUser.email)}`}
function renderShareholders(){const map=Object.fromEntries(shareholderDocs.map(s=>[s.shareholderCode,s]));$('shareholder-list').innerHTML=SHAREHOLDERS.map(s=>{const d=map[s.code];return `<div class="item"><div class="grow"><div class="title">${s.code} · ${esc(s.name)}</div><div class="sub">${d?`Firebase UID：${esc(d.uid)}`:'尚未建立 Firebase 帳號'}</div></div><span class="pill${d?'':' off'}">${d?'已建立':'待建立'}</span></div>`}).join('')}
async function initializeShareholders(){const password=$('initial-password').value;if(password.length<6)return setStatus('shareholder-status','臨時密碼至少需要 6 碼。','error');const existing=new Set(shareholderDocs.map(s=>s.shareholderCode));let created=0;setStatus('shareholder-status','正在建立股東帳號...');for(const s of SHAREHOLDERS){if(existing.has(s.code))continue;const secondary=initializeApp(firebaseConfig,`creator-${s.code}-${Date.now()}`);try{const secondaryAuth=getAuth(secondary),cred=await createUserWithEmailAndPassword(secondaryAuth,shareholderEmail(s.code),password);await setDoc(doc(db,'shareholders',cred.user.uid),{shareholderCode:s.code,displayName:s.name,active:true,createdAt:serverTimestamp()});await signOut(secondaryAuth);created++}catch(e){setStatus('shareholder-status',`${s.code} 建立失敗：${e.message}`,'error');await deleteApp(secondary);return}await deleteApp(secondary)}$('initial-password').value='';await loadShareholders();setStatus('shareholder-status',`完成：新增 ${created} 位股東帳號。`,'ok')}
function parseCode(name){return (name.toUpperCase().match(/(?:^|[_-])((?:PS|CS)\d{3})(?:[_-]|\.|$)/)||[])[1]||''}function updatePreview(){selectedFiles=[...$('statement-files').files];if(!selectedFiles.length)return $('file-preview').textContent='尚未選擇檔案。';$('file-preview').innerHTML=selectedFiles.map(f=>{const code=parseCode(f.name),known=SHAREHOLDERS.some(s=>s.code===code);return `<div class="${known?'ok':'error'}">${esc(f.name)} → ${code||'無法辨識編號'}${known?'':'（請檢查檔名）'}</div>`}).join('')}
async function publishStatements(){if(!selectedFiles.length)return setStatus('upload-status','請先選擇 PDF。','error');const month=$('statement-month').value,year=$('statement-year').value,monthId=year+month,map=Object.fromEntries(shareholderDocs.map(s=>[s.shareholderCode,s])),jobs=[];for(const file of selectedFiles){const code=parseCode(file.name),owner=map[code];if(!owner)return setStatus('upload-status',`${file.name} 無法配對已建立的股東帳號。`,'error');if(file.type&&file.type!=='application/pdf')return setStatus('upload-status',`${file.name} 不是 PDF。`,'error');jobs.push({file,code,owner})}setStatus('upload-status',`正在發布 ${jobs.length} 份 PDF...`);try{for(const job of jobs){const path=`statements/${job.owner.uid}/${monthId}/${job.file.name}`;await uploadBytes(ref(storage,path),job.file,{contentType:'application/pdf'});await setDoc(doc(db,'statements',job.owner.uid,'months',monthId),{year,month,label:`${year} 年 ${month} 月`,shareholderCode:job.code,storagePath:path,originalFileName:job.file.name,publishedAt:serverTimestamp()})}setStatus('upload-status',`發布完成：${jobs.length} 份 PDF 已寫入 ${year} 年 ${month} 月。`,'ok');$('statement-files').value='';selectedFiles=[];updatePreview()}catch(e){setStatus('upload-status',`發布失敗：${e.message}`,'error')}}
$('statement-month').innerHTML=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=>`<option>${m}</option>`).join('');$('statement-month').value='04';$('statement-files').addEventListener('change',updatePreview);renderShareholders();Object.assign(window,{adminLogin,adminLogout,initializeShareholders,publishStatements});onAuthStateChanged(auth,async user=>{if(!user)return;const token=await user.getIdTokenResult(true);if(token.claims.admin===true){$('gate').classList.add('hidden');await loadShareholders()}});
</script>
</body>
</html>
