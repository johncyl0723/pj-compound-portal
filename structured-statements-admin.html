<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股東持股資料化管理 - P&amp;J Compound Company Limited</title>
<style>
:root{--brown:#6D3A0F;--dark:#2C1503;--gold:#B8860B;--cream:#FAF7F2;--ink:#1C1917;--muted:#6B6560;--border:#E8E2D8;--pos:#15803D;--neg:#B91C1C}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;font-size:14px}.banner{height:64px;display:flex;align-items:center;gap:12px;padding:0 26px;background:linear-gradient(135deg,var(--dark),var(--brown));color:#fff}.banner img{width:42px;height:42px}.banner h1{font-size:17px}.badge{padding:4px 10px;border:1px solid rgba(255,220,120,.5);border-radius:14px;color:#ffe08a;font-size:11px;font-weight:700}.back{margin-left:auto;color:#fff;text-decoration:none;font-size:12px}.page{max-width:1440px;margin:auto;padding:28px 20px 60px}.head h2{margin:0;color:var(--brown)}.head p{color:var(--muted);font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05)}.card-head{padding:14px 17px;border-bottom:1px solid var(--border);background:#fdfaf6;color:var(--brown);font-weight:700}.body{padding:15px 17px}.row{display:flex;gap:10px;margin-bottom:10px}.group{display:flex;flex:1;flex-direction:column;gap:4px}.group label{color:var(--muted);font-size:11px;font-weight:700}.group input,.group select,.group textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:6px;font:inherit}.group textarea{min-height:96px;resize:vertical}.summary{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.summary span{padding:6px 10px;border-radius:14px;background:#fdfaf6;border:1px solid var(--border);font-size:12px}.table-wrap{border:1px solid var(--border);border-radius:8px;overflow:auto}.grid-table{width:100%;border-collapse:collapse;font-size:12px}.grid-table th,.grid-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;text-align:left}.grid-table th{background:#fdfaf6;color:var(--brown);white-space:nowrap}.grid-table tr:last-child td{border-bottom:0}.grid-table input{width:100%;padding:7px;border:1px solid var(--border);border-radius:5px;font:inherit}.btn{padding:9px 12px;border:0;border-radius:7px;background:linear-gradient(135deg,var(--dark),var(--brown));color:#fff;cursor:pointer;font:inherit;font-size:12px;font-weight:700}.btn.alt{border:1px solid var(--border);background:#fff;color:var(--brown)}.btn.warn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{color:var(--muted);font-size:12px;line-height:1.65}.ok{color:var(--pos);font-weight:700}.error{color:var(--neg);font-weight:700}.status{min-height:20px;margin-top:8px;font-size:12px;line-height:1.5}.pill{display:inline-block;padding:2px 7px;border-radius:10px;background:#dcfce7;color:#15803d;font-size:10px;font-weight:700}.pill.draft{background:#fef3c7;color:#92400e}.pill.missing{background:#f1f5f9;color:#475569}.gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--dark),#150800)}.gate.hidden{display:none}.gate-card{width:min(410px,100%);padding:30px;border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45)}.gate-card h2{margin-top:0;color:var(--brown)}.gate-card input{width:100%;margin-bottom:9px;padding:11px;border:1px solid var(--border);border-radius:7px;font:inherit}.gate-card .btn{width:100%}.preview-frame{width:100%;height:920px;border:1px solid var(--border);border-radius:8px;background:#f3f4f6}.build-badge{position:fixed;right:12px;bottom:12px;z-index:30;padding:6px 10px;border:1px solid rgba(109,58,15,.18);border-radius:999px;background:rgba(255,255,255,.95);color:var(--brown);font-size:11px;box-shadow:0 8px 18px rgba(0,0,0,.12)}@media(max-width:1100px){.grid{grid-template-columns:1fr}.preview-frame{height:760px}}@media(max-width:720px){.row{flex-direction:column}.banner{padding:0 14px}.page{padding:18px 12px 36px}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-card"><h2>Firebase 管理員登入</h2><p class="notice">這個頁面專門用來手動輸入股東持股資料。</p><input id="admin-email" type="email" value="john.cyl@gmail.com" autocomplete="username"><input id="admin-password" type="password" placeholder="管理員密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()"><button class="btn" onclick="adminLogin()">登入後臺</button><div class="status error" id="gate-status"></div></div></div>
<header class="banner"><img src="assets/pj-compound-mark.svg" alt="P&J Compound Logo"><h1>P&amp;J Compound Company Limited</h1><span class="badge">Structured Statements</span><a class="back" href="./firebase-admin.html">返回後臺主頁</a></header>
<main class="page">
  <div class="head">
    <h2>股東持股資料化管理</h2>
    <p>這個頁面專門處理「和 PDF 幾乎一致」的資料化股東持股報表。資料會寫進原本的 `statements/{uid}/months/{yyyymm}`，不會影響目前穩定運作的 PDF 後臺頁。</p>
    <div class="summary" id="top-summary"></div>
  </div>
  <div class="grid">
    <section class="card">
      <div class="card-head">資料輸入</div>
      <div class="body">
        <div class="row">
          <div class="group"><label>年份</label><select id="statement-year"><option>2025</option><option selected>2026</option><option>2027</option><option>2028</option></select></div>
          <div class="group"><label>月份</label><select id="statement-month"></select></div>
          <div class="group"><label>股東</label><select id="editor-shareholder"></select></div>
        </div>
        <div class="summary" id="editor-summary"></div>
        <div class="row">
          <div class="group"><label>報告性質</label><input id="statement-report-type"></div>
          <div class="group"><label>股份種類</label><select id="statement-share-class"><option value="PS">特別股 PS</option><option value="CS">普通股 CS</option></select></div>
          <div class="group"><label>幣別</label><input id="statement-currency" value="USD"></div>
        </div>
        <div class="row">
          <div class="group"><label>計算截止日</label><input id="statement-end-date" type="date"></div>
          <div class="group"><label>每單位淨值</label><input id="statement-nav-per-unit" type="number" step="0.0001"></div>
        </div>
        <div class="row">
          <div class="group"><label>已投資股份金額 USD</label><input id="statement-invested-amount" type="number" step="0.01"></div>
          <div class="group"><label>持有權益單位數</label><input id="statement-units-held" type="number" step="0.01"></div>
          <div class="group"><label>持有權益比例 %</label><input id="statement-ownership-percent" type="number" step="0.01"></div>
        </div>
        <div class="row">
          <div class="group"><label>目前持有權益市值 USD</label><input id="statement-market-value" type="number" step="0.01"></div>
          <div class="group"><label>投資增值 USD</label><input id="statement-gain-usd" type="number" step="0.01"></div>
          <div class="group"><label>累計增值報酬率 %</label><input id="statement-return-rate" type="number" step="0.01"></div>
        </div>
        <div class="group">
          <label>股利明細</label>
          <div class="table-wrap"><table class="grid-table"><thead><tr><th>年度</th><th>金額</th><th>領取方式</th><th>操作</th></tr></thead><tbody id="dividend-rows"></tbody></table></div>
          <div class="row" style="margin-top:8px"><button class="btn alt" type="button" onclick="addDividendRow()">新增股利列</button></div>
        </div>
        <div class="group">
          <label>投入明細</label>
          <div class="table-wrap"><table class="grid-table"><thead><tr><th>股東名稱</th><th>投資金額</th><th>投入日期</th><th>淨值日期/文字</th><th>買入淨值</th><th>取得單位數</th><th>備註</th><th>操作</th></tr></thead><tbody id="contribution-rows"></tbody></table></div>
          <div class="row" style="margin-top:8px"><button class="btn alt" type="button" onclick="addContributionRow()">新增投入列</button></div>
        </div>
        <div class="row">
          <div class="group"><label>說明事項 1</label><textarea id="statement-note-1"></textarea></div>
          <div class="group"><label>說明事項 2</label><textarea id="statement-note-2"></textarea></div>
          <div class="group"><label>說明事項 3</label><textarea id="statement-note-3"></textarea></div>
        </div>
        <div class="row">
          <button class="btn" onclick="saveStatementDraft()">保存為草稿</button>
          <button class="btn alt" onclick="publishStatement()">直接發布</button>
          <button class="btn alt" onclick="previewEditorStatement()">更新預覽</button>
          <button class="btn alt" onclick="resetStatementEditor()">重設表單</button>
        </div>
        <div class="status" id="editor-status"></div>
      </div>
    </section>
    <section class="card">
      <div class="card-head">版面預覽</div>
      <div class="body">
        <iframe id="statement-preview" class="preview-frame"></iframe>
      </div>
    </section>
  </div>
</main>
<div class="build-badge" id="build-badge">Structured</div>
<script type="module">
import { auth, db, functions } from './firebase-portal.js?v=20260630-announcementfix1';
import { DEFAULT_NOTES, buildShareholderStatementHtml, hasStatementStructuredData, normalizeStatementData } from './assets/shareholder-statement-template.js?v=20260701-structuredstatement1';
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
import { httpsCallable } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-functions.js';

const APP_VERSION = '20260701-structured-page1';
const getShareholderAdminData = httpsCallable(functions, 'getShareholderAdminData');
let shareholderDocs = [], draftDocs = [], statementDocs = [], editingStatementUid = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isBootstrapAdminEmail = (user) => String(user?.email || '').trim().toLowerCase() === 'john.cyl@gmail.com';
const hasPortalAdminAccess = (token, user) => token?.claims?.admin === true || isBootstrapAdminEmail(user);

function setStatus(id, text, type = '') {
  const el = $(id);
  el.textContent = text;
  el.className = `status ${type}`;
}

function statementMonthId() { return $('statement-year').value + $('statement-month').value; }
function statementLabel() { return `${$('statement-year').value} 年${$('statement-month').value} 月`; }
function statementFor(uid) { return statementDocs.find((s) => s.uid === uid); }
function isPublishedStatement(st) { return !!st && (st.status === 'published' || (!st.status && st.publishedAt)); }
function hasEditableStatement(st) { return !!st && (hasStatementStructuredData(st) || st.renderMode === 'structured-html'); }
function editorOwner() { return shareholderDocs.find((s) => s.uid === editingStatementUid) || shareholderDocs.find((s) => s.uid === $('editor-shareholder').value) || null; }

function adminLoginErrorMessage(error) {
  switch (error?.code) {
    case 'auth/invalid-credential':
    case 'auth/wrong-password':
    case 'auth/user-not-found':
      return '這組 Email / 密碼目前無法登入 Firebase 管理後台。';
    case 'auth/too-many-requests':
      return '嘗試次數過多，請稍候再試。';
    case 'auth/user-disabled':
      return '這個 Firebase 帳號已被停用。';
    default:
      return error?.message || '登入失敗，請稍後再試。';
  }
}

async function fetchShareholderAdminPayload() {
  const result = await getShareholderAdminData({ monthId: statementMonthId() });
  return result.data || result;
}

function defaultStatementData(owner) {
  return normalizeStatementData({
    shareholderCode: owner?.shareholderCode || '',
    shareholderName: owner?.displayName || '',
    shareClass: owner?.shareholderCode?.startsWith('CS') ? 'CS' : 'PS',
    currency: 'USD',
    notes: [...DEFAULT_NOTES],
    dividendRows: [
      { year: '2025', amount: '', method: '返投', sortOrder: 1 },
      { year: '2026', amount: '', method: '', sortOrder: 2 },
      { year: '2027', amount: '', method: '', sortOrder: 3 },
      { year: '2028', amount: '', method: '', sortOrder: 4 },
    ],
    contributionRows: [],
  });
}

function renderTopSummary() {
  const active = shareholderDocs.filter((s) => s.active !== false);
  const published = active.filter((s) => isPublishedStatement(statementFor(s.uid))).length;
  $('top-summary').innerHTML = [
    `<span>月份 ${statementLabel()}</span>`,
    `<span>股東 ${active.length} 位</span>`,
    `<span>已發布 ${published} 份</span>`,
    `<span>頁面版本 ${APP_VERSION}</span>`,
  ].join('');
}

function setEditorSummary(owner, st) {
  $('editor-summary').innerHTML = owner ? [
    `<span>${esc(owner.shareholderCode)} ${esc(owner.displayName)}</span>`,
    `<span>${statementLabel()}</span>`,
    `<span>${isPublishedStatement(st) ? '已發布' : st ? '草稿' : '尚未建立'}</span>`,
  ].join('') : '';
}

function renderEditorShareholders() {
  const active = shareholderDocs.filter((s) => s.active !== false).sort((a, b) => a.shareholderCode.localeCompare(b.shareholderCode));
  $('editor-shareholder').innerHTML = active.map((s) => `<option value="${esc(s.uid)}">${esc(s.shareholderCode)} ${esc(s.displayName)}</option>`).join('');
  if (editingStatementUid && active.some((s) => s.uid === editingStatementUid)) $('editor-shareholder').value = editingStatementUid;
  else if (active[0]) {
    $('editor-shareholder').value = active[0].uid;
    editingStatementUid = active[0].uid;
  }
}

function renderDividendRows(rows) {
  $('dividend-rows').innerHTML = rows.map((row, index) => `<tr><td><input data-kind="dividend-year" data-index="${index}" value="${esc(row.year || '')}"></td><td><input data-kind="dividend-amount" data-index="${index}" type="number" step="0.01" value="${esc(row.amount || '')}"></td><td><input data-kind="dividend-method" data-index="${index}" value="${esc(row.method || '')}"></td><td><button class="btn warn" type="button" onclick="removeDividendRow(${index})">刪除</button></td></tr>`).join('');
}

function renderContributionRows(rows) {
  $('contribution-rows').innerHTML = rows.map((row, index) => `<tr><td><input data-kind="contribution-name" data-index="${index}" value="${esc(row.shareholderName || '')}"></td><td><input data-kind="contribution-amount" data-index="${index}" type="number" step="0.01" value="${esc(row.fundedAmount || '')}"></td><td><input data-kind="contribution-date" data-index="${index}" type="date" value="${esc(row.contributionDate || '')}"></td><td><input data-kind="contribution-nav-label" data-index="${index}" value="${esc(row.navDateLabel || row.navDate || '')}"></td><td><input data-kind="contribution-buy-nav" data-index="${index}" type="number" step="0.0001" value="${esc(row.buyNavPerUnit || '')}"></td><td><input data-kind="contribution-units" data-index="${index}" type="number" step="0.01" value="${esc(row.unitsAcquired || '')}"></td><td><input data-kind="contribution-remark" data-index="${index}" value="${esc(row.remark || '')}"></td><td><button class="btn warn" type="button" onclick="removeContributionRow(${index})">刪除</button></td></tr>`).join('');
}

function fillStatementEditor(data) {
  $('statement-report-type').value = data.reportType || '';
  $('statement-share-class').value = data.shareClass || 'PS';
  $('statement-currency').value = data.currency || 'USD';
  $('statement-end-date').value = data.endDate || '';
  $('statement-nav-per-unit').value = data.navPerUnit ?? '';
  $('statement-invested-amount').value = data.investedAmountUsd ?? '';
  $('statement-units-held').value = data.unitsHeld ?? '';
  $('statement-ownership-percent').value = data.ownershipPercent ?? '';
  $('statement-market-value').value = data.marketValueUsd ?? '';
  $('statement-gain-usd').value = data.gainUsd ?? '';
  $('statement-return-rate').value = data.returnRatePercent ?? '';
  $('statement-note-1').value = data.notes?.[0] || DEFAULT_NOTES[0];
  $('statement-note-2').value = data.notes?.[1] || DEFAULT_NOTES[1];
  $('statement-note-3').value = data.notes?.[2] || DEFAULT_NOTES[2];
  renderDividendRows(data.dividendRows || []);
  renderContributionRows(data.contributionRows || []);
  previewEditorStatement();
}

function loadStatementEditor(uid) {
  editingStatementUid = uid;
  $('editor-shareholder').value = uid;
  const owner = shareholderDocs.find((s) => s.uid === uid);
  const current = statementFor(uid);
  const data = hasEditableStatement(current) ? normalizeStatementData(current) : defaultStatementData(owner);
  setEditorSummary(owner, current);
  fillStatementEditor(data);
}

function resetStatementEditor() {
  const owner = editorOwner();
  if (!owner) {
    $('editor-summary').innerHTML = '';
    $('statement-preview').srcdoc = '';
    return;
  }
  fillStatementEditor(defaultStatementData(owner));
  setEditorSummary(owner, null);
}

function collectRows(kind) {
  return [...document.querySelectorAll(`[data-kind^="${kind}-"]`)].reduce((acc, input) => {
    const index = Number(input.dataset.index);
    acc[index] ||= {};
    acc[index][input.dataset.kind.replace(`${kind}-`, '')] = input.value;
    return acc;
  }, []).filter(Boolean);
}

function collectStatementForm() {
  const owner = editorOwner();
  if (!owner) throw new Error('請先選擇股東。');
  const dividendRows = collectRows('dividend').map((row, index) => ({ year: row.year || '', amount: row.amount || '', method: row.method || '', sortOrder: index + 1 })).filter((row) => row.year || row.amount || row.method);
  const contributionRows = collectRows('contribution').map((row, index) => ({ shareholderName: row.name || owner.displayName, fundedAmount: row.amount || '', contributionDate: row.date || '', navDateLabel: row['nav-label'] || '', navDate: '', buyNavPerUnit: row['buy-nav'] || '', unitsAcquired: row.units || '', remark: row.remark || '', sortOrder: index + 1 })).filter((row) => row.shareholderName || row.fundedAmount || row.contributionDate || row.navDateLabel || row.buyNavPerUnit || row.unitsAcquired || row.remark);
  return {
    renderMode: 'structured-html',
    contentType: 'text/html',
    templateVersion: 1,
    year: $('statement-year').value,
    month: $('statement-month').value,
    label: statementLabel(),
    shareholderCode: owner.shareholderCode,
    shareholderName: owner.displayName,
    shareClass: $('statement-share-class').value,
    currency: $('statement-currency').value.trim() || 'USD',
    reportType: $('statement-report-type').value.trim() || '股東持有權益份額報告書',
    endDate: $('statement-end-date').value,
    navPerUnit: $('statement-nav-per-unit').value,
    investedAmountUsd: $('statement-invested-amount').value,
    unitsHeld: $('statement-units-held').value,
    ownershipPercent: $('statement-ownership-percent').value,
    marketValueUsd: $('statement-market-value').value,
    gainUsd: $('statement-gain-usd').value,
    returnRatePercent: $('statement-return-rate').value,
    dividendRows,
    contributionRows,
    notes: [$('statement-note-1').value.trim(), $('statement-note-2').value.trim(), $('statement-note-3').value.trim()].filter(Boolean),
  };
}

function previewEditorStatement() {
  try {
    $('statement-preview').srcdoc = buildShareholderStatementHtml(collectStatementForm());
    setStatus('editor-status', '版面預覽已更新。', 'ok');
  } catch (e) {
    setStatus('editor-status', `預覽失敗：${e.message}`, 'error');
  }
}

async function saveStatement(status = 'draft') {
  let payload;
  try { payload = collectStatementForm(); } catch (e) { setStatus('editor-status', e.message, 'error'); return; }
  const owner = editorOwner();
  setStatus('editor-status', `正在保存 ${owner.shareholderCode} 的資料...`);
  await setDoc(doc(db, 'statements', owner.uid, 'months', statementMonthId()), {
    ...payload,
    status,
    publishedAt: status === 'published' ? serverTimestamp() : null,
    updatedAt: serverTimestamp(),
  }, { merge: true });
  await loadData();
  setStatus('editor-status', `${owner.shareholderCode} 已${status === 'published' ? '發布' : '保存為草稿'}。`, 'ok');
}

async function saveStatementDraft() { await saveStatement('draft'); }
async function publishStatement() { await saveStatement('published'); }

async function loadData() {
  const result = await fetchShareholderAdminPayload();
  shareholderDocs = result.shareholders || [];
  draftDocs = result.drafts || [];
  statementDocs = result.statements || [];
  renderTopSummary();
  renderEditorShareholders();
  if (editingStatementUid && shareholderDocs.some((s) => s.uid === editingStatementUid)) loadStatementEditor(editingStatementUid);
  else {
    const firstActive = shareholderDocs.find((s) => s.active !== false);
    if (firstActive) loadStatementEditor(firstActive.uid);
  }
}

async function adminLogin() {
  setStatus('gate-status', '登入中...');
  try {
    const cred = await signInWithEmailAndPassword(auth, $('admin-email').value.trim(), $('admin-password').value);
    const token = await cred.user.getIdTokenResult(true);
    if (!hasPortalAdminAccess(token, cred.user)) {
      await signOut(auth);
      throw new Error('此帳號尚未取得後台管理權限。');
    }
    $('gate').classList.add('hidden');
    setStatus('gate-status', '');
    await loadData();
  } catch (e) {
    setStatus('gate-status', adminLoginErrorMessage(e), 'error');
  }
}

async function adminLogout() {
  await signOut(auth);
  location.reload();
}

function addDividendRow() {
  const rows = collectRows('dividend').map((row, index) => ({ year: row.year || '', amount: row.amount || '', method: row.method || '', sortOrder: index + 1 }));
  rows.push({ year: '', amount: '', method: '', sortOrder: rows.length + 1 });
  renderDividendRows(rows);
}

function removeDividendRow(index) {
  const rows = collectRows('dividend').filter((_, i) => i !== index).map((row, i) => ({ year: row.year || '', amount: row.amount || '', method: row.method || '', sortOrder: i + 1 }));
  renderDividendRows(rows);
}

function addContributionRow() {
  const owner = editorOwner();
  const rows = collectRows('contribution').map((row, index) => ({ shareholderName: row.name || owner?.displayName || '', fundedAmount: row.amount || '', contributionDate: row.date || '', navDateLabel: row['nav-label'] || '', buyNavPerUnit: row['buy-nav'] || '', unitsAcquired: row.units || '', remark: row.remark || '', sortOrder: index + 1 }));
  rows.push({ shareholderName: owner?.displayName || '', fundedAmount: '', contributionDate: '', navDateLabel: '', buyNavPerUnit: '', unitsAcquired: '', remark: '', sortOrder: rows.length + 1 });
  renderContributionRows(rows);
}

function removeContributionRow(index) {
  const owner = editorOwner();
  const rows = collectRows('contribution').filter((_, i) => i !== index).map((row, i) => ({ shareholderName: row.name || owner?.displayName || '', fundedAmount: row.amount || '', contributionDate: row.date || '', navDateLabel: row['nav-label'] || '', buyNavPerUnit: row['buy-nav'] || '', unitsAcquired: row.units || '', remark: row.remark || '', sortOrder: i + 1 }));
  renderContributionRows(rows);
}

$('statement-month').innerHTML = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0')).map((m) => `<option>${m}</option>`).join('');
$('statement-month').value = '05';
$('statement-year').addEventListener('change', loadData);
$('statement-month').addEventListener('change', loadData);
$('editor-shareholder').addEventListener('change', (e) => loadStatementEditor(e.target.value));
$('build-badge').textContent = `Structured ${APP_VERSION}`;
Object.assign(window, { adminLogin, adminLogout, saveStatementDraft, publishStatement, previewEditorStatement, resetStatementEditor, addDividendRow, removeDividendRow, addContributionRow, removeContributionRow });
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    const token = await user.getIdTokenResult(true);
    if (hasPortalAdminAccess(token, user)) {
      $('gate').classList.add('hidden');
      await loadData();
    }
  } catch (e) {
    setStatus('gate-status', '登入驗證失敗。', 'error');
  }
});
</script>
</body>
</html>
