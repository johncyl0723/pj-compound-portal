<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P&amp;J Compound Company Limited — 投資組合入口</title>
<script src="./portal-config.js"></script>
<style>
  :root {
    --green: #6D3A0F;
    --green-dark: #2C1503;
    --green-light: #A05C1A;
    --gold: #B8860B;
    --gold-dark: #9A6E08;
    --cream: #FAF7F2;
    --ink: #1C1917;
    --muted: #6B6560;
    --border: #E8E2D8;
    --sidebar-bg: #1E0D02;
    --sidebar-hover: rgba(184,134,11,0.14);
    --sidebar-active: rgba(184,134,11,0.25);
    --sidebar-text: #E8D5A0;
    --sidebar-muted: rgba(232,213,160,0.5);
    --sidebar-width: 268px;
    --banner-height: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Segoe UI','Helvetica Neue','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    font-size: 14px; background: var(--cream); color: var(--ink);
  }

  /* ── Banner ── */
  .banner {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--banner-height);
    background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 60%, var(--green-light) 100%);
    color: #fff;
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 16px;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
    border-bottom: 1px solid rgba(184,134,11,.25);
  }
  .banner-logo-img {
    width: 44px; height: 44px; flex-shrink: 0;
    display: block;
    filter: drop-shadow(0 2px 8px rgba(239,126,27,0.30));
  }
  .banner-text { display: flex; flex-direction: column; gap: 1px; }
  .banner-title { font-size: 16px; font-weight: 700; letter-spacing: .3px; color: #fff; }
  .banner-sub { font-size: 10px; opacity: .6; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
  .banner-divider { width: 1px; height: 30px; background: rgba(255,255,255,.15); margin: 0 4px; }
  .banner-badge {
    margin-left: auto;
    padding: 5px 14px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,220,120,.55);
    border-radius: 16px;
    font-size: 11px; color: #FFE08A; font-weight: 700; letter-spacing: .6px;
  }

  /* ── Body layout ── */
  .body-wrap {
    position: fixed;
    top: var(--banner-height); left: 0; right: 0; bottom: 0;
    display: flex;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: var(--sidebar-bg);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(184,134,11,.18);
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(184,134,11,.3); border-radius: 2px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }

  .sidebar-section { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .sidebar-section:last-child { border-bottom: none; }

  .nav-group-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 18px;
    cursor: pointer;
    color: var(--gold);
    font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
    user-select: none;
    transition: background .15s;
    border-radius: 4px;
    margin: 0 4px;
  }
  .nav-group-header:hover { background: var(--sidebar-hover); }
  .nav-group-header .icon { font-size: 13px; margin-right: 8px; }
  .nav-group-header .chevron { font-size: 10px; transition: transform .2s; opacity: .6; margin-left: auto; }
  .nav-group-header.open .chevron { transform: rotate(90deg); }

  .nav-sub { display: none; padding: 2px 0 6px; }
  .nav-sub.open { display: block; }

  .nav-item {
    display: flex; align-items: center;
    padding: 9px 18px 9px 38px;
    cursor: pointer;
    color: var(--sidebar-text);
    font-size: 13px;
    border-radius: 4px;
    margin: 1px 4px;
    transition: background .15s, color .15s;
    user-select: none;
  }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active {
    background: var(--sidebar-active);
    color: var(--gold);
    font-weight: 600;
    border-left: 3px solid var(--gold);
    padding-left: 35px;
  }
  .nav-item .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-right: 10px; flex-shrink: 0; opacity: .6; }
  .nav-item.active .dot { opacity: 1; }

  .nav-cat-header {
    display: flex; align-items: center;
    padding: 6px 18px 6px 26px;
    cursor: pointer;
    color: rgba(212,196,160,.6);
    font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    border-radius: 4px; margin: 2px 4px;
    transition: background .15s, color .15s;
    user-select: none;
  }
  .nav-cat-header:hover { background: var(--sidebar-hover); color: var(--sidebar-text); }
  .nav-cat-header .cat-chevron { font-size: 9px; transition: transform .2s; opacity: .5; margin-left: auto; }
  .nav-cat-header.open .cat-chevron { transform: rotate(90deg); }
  .nav-cat-items { display: none; }
  .nav-cat-items.open { display: block; }
  .nav-cat-items .nav-item { padding-left: 50px; }

  .sidebar-footer {
    margin-top: auto;
    padding: 14px 16px;
    font-size: 10px;
    color: var(--sidebar-muted);
    border-top: 1px solid rgba(255,255,255,.06);
    line-height: 1.7;
  }

  /* ── Main / iframe ── */
  .main-frame {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #150800 0%, #2C1503 100%);
  }
  #content-iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: #fff;
  }

  /* Welcome screen */
  .welcome {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px; text-align: center;
    background: linear-gradient(135deg, #150800 0%, #2C1503 100%);
    color: rgba(212,196,160,.7);
  }
  .welcome-icon { width: 88px; height: 88px; margin-bottom: 24px; opacity: .85; }
  .welcome-icon img { width: 100%; height: 100%; display: block; }
  .welcome h2 { font-size: 22px; font-weight: 600; color: var(--gold); margin-bottom: 10px; letter-spacing: .3px; }
  .welcome p { font-size: 14px; line-height: 1.7; max-width: 360px; opacity: .75; }
  .welcome .hint { margin-top: 24px; font-size: 12px; padding: 10px 20px; border: 1px solid rgba(184,134,11,.3); border-radius: 20px; color: var(--gold); opacity: .7; }
</style>
</head>
<body>

<!-- Banner -->
<header class="banner">
  <img class="banner-logo-img" src="assets/pj-compound-mark.svg" alt="P&amp;J Compound" />
  <div class="banner-text">
    <div class="banner-title">P&amp;J Compound Company Limited</div>
    <div class="banner-sub">Investment Portfolio Portal</div>
  </div>
  <div class="banner-badge">投資組合管理入口</div>
</header>

<!-- Body -->
<div class="body-wrap">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <!-- Monthly Reports section -->
    <div class="sidebar-section">
      <div class="nav-group-header open" id="hdr-reports" onclick="toggleSection('reports')">
        <span class="icon">📊</span>月報表 Monthly Reports
        <span class="chevron">▶</span>
      </div>
      <div class="nav-sub open" id="sub-reports" style="display:block"></div>
    </div>

    <!-- Topics section -->
    <div class="sidebar-section">
      <div class="nav-group-header open" id="hdr-topics" onclick="toggleSection('topics')">
        <span class="icon">📚</span>財經專題 Research
        <span class="chevron">▶</span>
      </div>
      <div class="nav-sub open" id="sub-topics" style="display:block"></div>
    </div>

    <div class="sidebar-footer">
      P&amp;J Compound Company Limited<br>
      For Information Purpose Only<br>
      <span id="footer-updated"></span>
    </div>
  </nav>

  <!-- Main content -->
  <div class="main-frame" id="main-frame">
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon"><img src="assets/pj-compound-mark.svg" alt="P&amp;J Compound" /></div>
      <h2>P&amp;J Compound Company Limited</h2>
      <p>請從左側選單選擇月報表或財經專題以開始瀏覽。</p>
      <div class="hint">← 請從左側選擇內容</div>
    </div>
    <iframe id="content-iframe" src="" style="display:none"></iframe>
  </div>
</div>

<script>
// ── Config loader ──
function loadConfig() {
  // Try published config first, fallback to defaults
  const raw = localStorage.getItem('pj_compound_config_published') || localStorage.getItem('pj_compound_config');
  if (raw) { try { return JSON.parse(raw); } catch(e) {} }
  return { monthlyReports: [], topics: [], categories: [] };
}

let cfg = loadConfig();

// ── Build sidebar ──
function buildSidebar() {
  buildReports();
  buildTopics();
  const ts = cfg._savedAt ? new Date(cfg._savedAt).toLocaleDateString('zh-TW') : '';
  if (ts) document.getElementById('footer-updated').textContent = '更新日期：' + ts;
}

function buildReports() {
  const container = document.getElementById('sub-reports');
  const reports = (cfg.monthlyReports || []).slice().sort((a,b) => b.key.localeCompare(a.key));
  container.innerHTML = '';
  if (!reports.length) {
    container.innerHTML = '<div style="padding:8px 18px 8px 38px;color:rgba(212,196,160,.35);font-size:12px;">尚無月報</div>';
    return;
  }
  reports.forEach(r => {
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.dataset.src = r.src;
    el.dataset.key = r.key;
    el.innerHTML = `<span class="dot"></span>${r.label}`;
    el.addEventListener('click', () => navigate(el, r.src));
    container.appendChild(el);
  });
}

function buildTopics() {
  const container = document.getElementById('sub-topics');
  const topics = cfg.topics || [];
  const cats = cfg.categories || [];
  container.innerHTML = '';

  if (!topics.length) {
    container.innerHTML = '<div style="padding:8px 18px 8px 38px;color:rgba(212,196,160,.35);font-size:12px;">尚無主題</div>';
    return;
  }

  // Group by category
  const catMap = {};
  cats.forEach(c => { catMap[c.key] = { ...c, items: [] }; });
  const uncatItems = [];
  topics.forEach(t => {
    if (t.categoryKey && catMap[t.categoryKey]) catMap[t.categoryKey].items.push(t);
    else uncatItems.push(t);
  });

  function makeTopicItem(t) {
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.dataset.src = t.src;
    el.innerHTML = `<span class="dot"></span>${t.title}`;
    el.addEventListener('click', () => navigate(el, t.src));
    return el;
  }

  cats.forEach(c => {
    const catData = catMap[c.key];
    if (!catData.items.length) return;
    const hdr = document.createElement('div');
    hdr.className = 'nav-cat-header open';
    hdr.innerHTML = `${c.name}<span class="cat-chevron">▶</span>`;
    const sub = document.createElement('div');
    sub.className = 'nav-cat-items open';
    catData.items.sort((a,b) => (a.order||0)-(b.order||0)).forEach(t => sub.appendChild(makeTopicItem(t)));
    hdr.addEventListener('click', () => { hdr.classList.toggle('open'); sub.classList.toggle('open'); });
    container.appendChild(hdr);
    container.appendChild(sub);
  });
  uncatItems.forEach(t => container.appendChild(makeTopicItem(t)));
}

// ── Navigation ──
function navigate(el, src) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  const iframe = document.getElementById('content-iframe');
  const welcome = document.getElementById('welcome-screen');
  welcome.style.display = 'none';
  iframe.style.display = 'block';
  iframe.src = src;
}

// ── Toggle sidebar section ──
function toggleSection(id) {
  const hdr = document.getElementById('hdr-' + id);
  const sub = document.getElementById('sub-' + id);
  hdr.classList.toggle('open');
  sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
}

// ── Init ──
buildSidebar();
</script>
</body>
</html>
