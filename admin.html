<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後臺管理 — P&amp;J Compound Company Limited</title>
<script src="./portal-config.js?v=20260601-clients"></script>
<style>
:root{--brown:#6D3A0F;--dark:#2C1503;--light:#A05C1A;--gold:#B8860B;--cream:#FAF7F2;--ink:#1C1917;--muted:#6B6560;--border:#E8E2D8;--card:#fff;--pos:#15803D;--neg:#B91C1C}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--cream);color:var(--ink);font-family:'Segoe UI','Microsoft JhengHei',system-ui,sans-serif;font-size:14px}
.banner{height:64px;display:flex;align-items:center;gap:14px;padding:0 28px;background:linear-gradient(135deg,var(--dark),var(--brown),var(--light));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}.brand-login{display:flex;align-items:center;gap:14px;padding:4px 8px 4px 4px;border:0;border-radius:10px;background:transparent;color:#fff;cursor:pointer;text-align:left;transition:background .2s,transform .2s}.brand-login:hover{background:rgba(255,255,255,.1)}.brand-login:active{transform:translateY(1px)}.brand-login:focus-visible{outline:2px solid #E3B54B;outline-offset:3px}.banner-logo{width:42px;height:42px;overflow:hidden}.banner-logo img{width:100%;height:100%;display:block}.banner h1{font-size:17px}.badge{padding:4px 10px;border:1px solid rgba(255,220,120,.5);border-radius:14px;color:#ffe08a;font-size:11px;font-weight:700}.back{margin-left:auto;color:#fff;text-decoration:none;font-size:12px;opacity:.85}.page{max-width:1400px;margin:auto;padding:30px 22px 80px}.page-head{margin-bottom:22px}.page-head h2{color:var(--brown);font-size:23px}.page-head p{margin-top:5px;color:var(--muted);font-size:13px}.sections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}@media(max-width:1100px){.sections{grid-template-columns:1fr}}.card{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}.card-head{display:flex;align-items:center;gap:8px;padding:15px 18px;border-bottom:1px solid var(--border);background:#fdfaf6;color:var(--brown);font-weight:700}.count{padding:2px 8px;border-radius:12px;background:rgba(109,58,15,.1);font-size:11px}.body{padding:15px 18px}.list{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}.item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fdfaf6}.grow{flex:1;min-width:0}.title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{margin-top:3px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:17px;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:12px;text-align:center}.form{padding-top:14px;border-top:1px solid var(--border)}.form h3{margin-bottom:10px;color:var(--muted);font-size:12px;letter-spacing:.5px}.row{display:flex;gap:8px;margin-bottom:9px}.group{display:flex;flex:1;flex-direction:column;gap:4px;min-width:0}.group label{color:var(--muted);font-size:11px;font-weight:600}.group input,.group select,.group textarea{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:13px}.group textarea{min-height:62px;resize:vertical}.btn{padding:9px 12px;border:0;border-radius:7px;background:linear-gradient(135deg,var(--dark),var(--brown));color:#fff;cursor:pointer;font:inherit;font-size:12px;font-weight:700}.btn.full{width:100%}.btn.small{padding:6px 8px}.btn.alt{background:#fff;color:var(--brown);border:1px solid var(--border)}.btn.danger{background:#fee2e2;color:var(--neg)}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{margin:8px 0;color:var(--muted);font-size:11px;line-height:1.6}.savebar{position:fixed;inset:auto 0 0 0;display:flex;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--border);background:rgba(250,247,242,.96);box-shadow:0 -2px 10px rgba(0,0,0,.05)}.status{flex:1;color:var(--muted);font-size:13px}.status.ok{color:var(--pos);font-weight:700}.gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--dark),#150800)}.gate.hidden{display:none}.gate-card{width:100%;max-width:400px;padding:34px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}.gate-card h2{color:var(--brown);font-size:21px}.gate-card p{margin:8px 0 18px;color:var(--muted);font-size:13px;line-height:1.6}.gate-input{width:100%;margin-bottom:10px;padding:11px;border:1px solid var(--border);border-radius:7px;font:inherit}.error{min-height:18px;margin-bottom:7px;color:var(--neg);font-size:12px}.gate-note{margin-top:13px!important;font-size:11px!important}.client-state{padding:2px 7px;border-radius:10px;background:#dcfce7;color:#15803d;font-size:10px;font-weight:700}.client-state.off{background:#fee2e2;color:#b91c1c}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-card"><h2 id="gate-title">管理員登入</h2><p id="gate-text">請輸入管理員密碼後進入後臺。</p><input class="gate-input" type="password" id="gate-password" placeholder="請輸入管理員密碼" onkeydown="if(event.key==='Enter')submitGate()"><div class="error" id="gate-error"></div><button class="btn full" onclick="submitGate()">確認進入後臺</button><p class="gate-note">GitHub Pages 僅能提供入口防護。管理員密碼只會以 SHA-256 雜湊形式處理。</p></div></div>
<header class="banner"><button class="brand-login" type="button" onclick="returnToPortalLogin()" aria-label="返回公司登入畫面"><div class="banner-logo"><img src="assets/pj-compound-mark.svg" alt="P&J Compound Logo"></div><h1>P&amp;J Compound Company Limited</h1></button><span class="badge">後臺管理 ADMIN</span><a class="back" href="./index.html" onclick="returnToPortalLogin();return false">← 返回入口網站</a></header>
<div class="page"><div class="page-head"><h2>入口網站內容管理</h2><p>管理月報、財經專題與客戶登入資料。完成後請儲存並匯出設定檔，再加入網站儲存庫。</p></div>
<div class="sections">
<section class="card"><div class="card-head">📊 月報表 <span class="count" id="report-count">0</span></div><div class="body"><div class="list" id="report-list"></div><div class="form"><h3>新增月報</h3><div class="row"><div class="group"><label>年份</label><select id="report-year"><option>2025</option><option selected>2026</option><option>2027</option><option>2028</option></select></div><div class="group"><label>月份</label><select id="report-month"></select></div></div><div class="row"><div class="group"><label>HTML 檔案路徑</label><input id="report-src" placeholder="./2026_05/202605_Monthly_Report.html"></div></div><button class="btn full" onclick="addReport()">＋ 新增月報</button></div></div></section>
<section class="card"><div class="card-head">📚 重要財經專題 <span class="count" id="topic-count">0</span></div><div class="body"><div class="list" id="topic-list"></div><div class="form"><h3>專題分類</h3><div class="list" id="category-list"></div><div class="row"><div class="group"><input id="category-name" placeholder="新增分類名稱"></div><button class="btn small" onclick="addCategory()">新增</button></div></div><div class="form"><h3>新增財經專題</h3><div class="row"><div class="group"><label>分類</label><select id="topic-category"></select></div><div class="group"><label>排序</label><input id="topic-order" type="number" value="1" min="1"></div></div><div class="row"><div class="group"><label>標題</label><input id="topic-title"></div></div><div class="row"><div class="group"><label>說明</label><textarea id="topic-body"></textarea></div></div><div class="row"><div class="group"><label>檔案路徑</label><input id="topic-src" placeholder="./topics/research.pdf"></div></div><button class="btn full" onclick="addTopic()">＋ 新增專題</button></div></div></section>
<section class="card"><div class="card-head">👤 客戶管理 <span class="count" id="client-count">0</span></div><div class="body"><div class="list" id="client-list"></div><div class="form"><h3 id="client-form-title">新增客戶</h3><input type="hidden" id="client-edit-index" value=""><div class="row"><div class="group"><label>客戶名稱</label><input id="client-name" placeholder="例如：PHILIP"></div><div class="group"><label>排序</label><input id="client-order" type="number" value="1" min="1"></div></div><div class="row"><div class="group"><label>登入密碼（明碼輸入）</label><input id="client-password" type="text" placeholder="新增客戶必填；編輯時留空可保留原密碼"></div></div><div class="row"><div class="group"><label>備註</label><textarea id="client-note" placeholder="選填，僅供後臺辨識"></textarea></div></div><div class="row"><label><input id="client-active" type="checkbox" checked> 啟用此客戶</label></div><p class="notice">密碼輸入時可直接閱讀。儲存後只保留 SHA-256 雜湊，因此無法反向顯示既有密碼；需要變更時請重新設定。</p><div class="row"><button class="btn full" onclick="saveClient()">儲存客戶</button><button class="btn alt" onclick="resetClientForm()">清除</button></div></div><div class="form"><h3>管理員密碼</h3><div class="row"><div class="group"><input id="new-admin-password" type="password" placeholder="輸入新的管理員密碼"></div></div><button class="btn alt full" onclick="changeAdminPassword()">重設此瀏覽器管理員密碼</button></div></div></section>
</div></div>
<div class="savebar"><div class="status" id="status">尚未儲存的變更不會反映到入口網站。</div><button class="btn alt" onclick="resetDefault()">還原預設</button><button class="btn alt" onclick="exportConfig()">匯出 portal-config.js ↓</button><button class="btn" onclick="saveConfig()">儲存並套用 ✓</button></div>
<script>
const STORAGE='pj_compound_config',PUB='pj_compound_config_published',ADMIN_HASH='pj_compound_admin_hash',ADMIN_HASH_VERSION='pj_compound_admin_hash_version',ADMIN_AUTH='pj_compound_admin_auth',CLIENT_AUTH='pj_compound_client_auth';
const DEFAULT_ADMIN_HASH='982f840d0dffbbd69c5c24c3ab4550af7b39451436da4a1a030b2d1d2cbf1a58',DEFAULT_ADMIN_HASH_VERSION='20260601-admin-v1';
const DEFAULT={_savedAt:'2026-05-31T00:00:00.000Z',monthlyReports:[{key:'202604',label:'2026 年 04 月',src:'./2026_04/202604_Monthly_Report.html'}],topics:[],categories:[{key:'cat-macro',name:'總體經濟分析'},{key:'cat-market',name:'市場動態解讀'}],clients:[{key:'client-philip',name:'PHILIP',passwordHash:'',active:true,order:1,note:''}]};
const clone=o=>JSON.parse(JSON.stringify(o));let draft=clone(DEFAULT);
async function sha256(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function bootGate(){if(localStorage.getItem(ADMIN_HASH_VERSION)!==DEFAULT_ADMIN_HASH_VERSION){localStorage.setItem(ADMIN_HASH,DEFAULT_ADMIN_HASH);localStorage.setItem(ADMIN_HASH_VERSION,DEFAULT_ADMIN_HASH_VERSION);sessionStorage.removeItem(ADMIN_AUTH)}if(sessionStorage.getItem(ADMIN_AUTH)==='1')document.getElementById('gate').classList.add('hidden')}
async function submitGate(){const p=document.getElementById('gate-password').value,e=document.getElementById('gate-error'),stored=localStorage.getItem(ADMIN_HASH);if(!p){e.textContent='請輸入管理員密碼。';return}if(await sha256(p)!==stored){e.textContent='管理員密碼錯誤。';return}sessionStorage.setItem(ADMIN_AUTH,'1');document.getElementById('gate').classList.add('hidden')}
function returnToPortalLogin(){sessionStorage.removeItem(ADMIN_AUTH);sessionStorage.removeItem(CLIENT_AUTH);location.href='./index.html'}
function init(){try{draft=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem(PUB)||JSON.stringify(DEFAULT))}catch{draft=clone(DEFAULT)};draft.monthlyReports||=[];draft.topics||=[];draft.categories||=[];draft.clients||=clone(DEFAULT.clients);renderAll();updateReportPath()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderAll(){renderReports();renderCategories();renderTopics();renderClients()}
function renderReports(){const el=document.getElementById('report-list');document.getElementById('report-count').textContent=draft.monthlyReports.length;el.innerHTML=draft.monthlyReports.length?draft.monthlyReports.map((r,i)=>`<div class="item"><div class="grow"><div class="title">${esc(r.label)}</div><div class="sub">${esc(r.src)}</div></div><button class="btn danger small" onclick="delReport(${i})">刪除</button></div>`).join(''):'<div class="empty">尚無月報</div>'}
function addReport(){const y=document.getElementById('report-year').value,m=document.getElementById('report-month').value,src=document.getElementById('report-src').value.trim(),key=y+m;if(!src)return alert('請輸入路徑。');if(draft.monthlyReports.some(r=>r.key===key))return alert('此月份已存在。');draft.monthlyReports.unshift({key,label:`${y} 年 ${m} 月`,src});renderReports();dirty()}
function delReport(i){if(confirm('確定刪除此月報？')){draft.monthlyReports.splice(i,1);renderReports();dirty()}}
function updateReportPath(){const y=document.getElementById('report-year').value,m=document.getElementById('report-month').value;document.getElementById('report-src').value=`./${y}_${m}/${y}${m}_Monthly_Report.html`}
function renderCategories(){const list=document.getElementById('category-list'),sel=document.getElementById('topic-category');list.innerHTML=draft.categories.length?draft.categories.map((c,i)=>`<div class="item"><div class="grow title">${esc(c.name)}</div><button class="btn danger small" onclick="delCategory(${i})">刪除</button></div>`).join(''):'<div class="empty">尚無分類</div>';sel.innerHTML='<option value="">未分類</option>'+draft.categories.map(c=>`<option value="${esc(c.key)}">${esc(c.name)}</option>`).join('')}
function addCategory(){const n=document.getElementById('category-name').value.trim();if(!n)return;draft.categories.push({key:'cat-'+Date.now(),name:n});document.getElementById('category-name').value='';renderCategories();dirty()}
function delCategory(i){if(confirm('確定刪除此分類？相關專題將改為未分類。')){const k=draft.categories[i].key;draft.topics.forEach(t=>{if(t.categoryKey===k)t.categoryKey=''});draft.categories.splice(i,1);renderCategories();renderTopics();dirty()}}
function renderTopics(){const el=document.getElementById('topic-list');document.getElementById('topic-count').textContent=draft.topics.length;el.innerHTML=draft.topics.length?draft.topics.map((t,i)=>`<div class="item"><div class="grow"><div class="title">${esc(t.title)}</div><div class="sub">${esc(t.src||t.body||'尚無內容')}</div></div><button class="btn danger small" onclick="delTopic(${i})">刪除</button></div>`).join(''):'<div class="empty">尚無專題</div>'}
function addTopic(){const title=document.getElementById('topic-title').value.trim();if(!title)return alert('請輸入標題。');draft.topics.push({key:'topic-'+Date.now(),title,body:document.getElementById('topic-body').value.trim(),src:document.getElementById('topic-src').value.trim(),categoryKey:document.getElementById('topic-category').value,order:Math.max(1,+document.getElementById('topic-order').value||1)});['topic-title','topic-body','topic-src'].forEach(id=>document.getElementById(id).value='');renderTopics();dirty()}
function delTopic(i){if(confirm('確定刪除此專題？')){draft.topics.splice(i,1);renderTopics();dirty()}}
function renderClients(){const el=document.getElementById('client-list');document.getElementById('client-count').textContent=draft.clients.length;el.innerHTML=draft.clients.length?draft.clients.slice().sort((a,b)=>(a.order||999)-(b.order||999)).map(c=>{const i=draft.clients.indexOf(c);return`<div class="item"><div class="grow"><div class="title">${esc(c.name)} <span class="client-state${c.active===false?' off':''}">${c.active===false?'停用':'啟用'}</span></div><div class="sub">排序 ${c.order||1} · ${c.passwordHash?'密碼已設定':'尚未設定密碼'}${c.note?' · '+esc(c.note):''}</div></div><button class="btn alt small" onclick="editClient(${i})">編輯</button><button class="btn danger small" onclick="delClient(${i})">刪除</button></div>`}).join(''):'<div class="empty">尚無客戶</div>'}
function editClient(i){const c=draft.clients[i];document.getElementById('client-edit-index').value=i;document.getElementById('client-form-title').textContent='編輯客戶';document.getElementById('client-name').value=c.name;document.getElementById('client-order').value=c.order||1;document.getElementById('client-password').value='';document.getElementById('client-note').value=c.note||'';document.getElementById('client-active').checked=c.active!==false}
function resetClientForm(){document.getElementById('client-edit-index').value='';document.getElementById('client-form-title').textContent='新增客戶';document.getElementById('client-name').value='';document.getElementById('client-order').value=draft.clients.length+1;document.getElementById('client-password').value='';document.getElementById('client-note').value='';document.getElementById('client-active').checked=true}
async function saveClient(){const idx=document.getElementById('client-edit-index').value,name=document.getElementById('client-name').value.trim(),pw=document.getElementById('client-password').value;if(!name)return alert('請輸入客戶名稱。');if(idx===''&&!pw)return alert('新增客戶時請設定密碼。');const old=idx===''?{}:draft.clients[+idx],client={...old,key:old.key||'client-'+Date.now(),name,active:document.getElementById('client-active').checked,order:Math.max(1,+document.getElementById('client-order').value||1),note:document.getElementById('client-note').value.trim()};if(pw)client.passwordHash=await sha256(pw);if(idx==='')draft.clients.push(client);else draft.clients[+idx]=client;resetClientForm();renderClients();dirty()}
function delClient(i){if(confirm('確定刪除此客戶？')){draft.clients.splice(i,1);renderClients();dirty()}}
async function changeAdminPassword(){const p=document.getElementById('new-admin-password').value;if(!p)return alert('請輸入新的管理員密碼。');localStorage.setItem(ADMIN_HASH,await sha256(p));document.getElementById('new-admin-password').value='';alert('管理員密碼已更新。')}
function dirty(){const s=document.getElementById('status');s.textContent='有未儲存的變更，請記得儲存。';s.className='status'}
function saveConfig(){draft._savedAt=new Date().toISOString();localStorage.setItem(STORAGE,JSON.stringify(draft));localStorage.setItem(PUB,JSON.stringify(draft));const s=document.getElementById('status');s.textContent='已儲存並套用到此瀏覽器。';s.className='status ok'}
function resetDefault(){if(confirm('確定還原預設內容？')){draft=clone(DEFAULT);renderAll();dirty()}}
function exportConfig(){draft._savedAt=new Date().toISOString();const content=`// P&J Compound Company Limited — Portal Content Configuration\n// Generated: ${draft._savedAt}\n// Published data contains SHA-256 password hashes only. No plaintext passwords are exported.\nlocalStorage.setItem('${PUB}', JSON.stringify(${JSON.stringify(draft,null,2)}));\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/javascript'}));a.download='portal-config.js';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('report-month').innerHTML=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=>`<option>${m}</option>`).join('');document.getElementById('report-month').value='05';document.getElementById('report-year').onchange=updateReportPath;document.getElementById('report-month').onchange=updateReportPath;bootGate();init();
</script>
</body>
</html>
